services:
  swarm-platform-kernel-db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD:
      POSTGRES_HOST_AUTH_METHOD: trust
    command: [ "postgres", "-c", "config_file=/etc/postgresql/postgresql.conf" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - ./db/dumps:/docker-entrypoint-initdb.d
      - ./db/postgresql/postgresql.conf:/etc/postgresql/postgresql.conf
      - swarm-platform-kernel-db-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks:
      - swarm-platform-kernel-system
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'   # Use up to 0.5 CPU core on M4 Pro (equivalent to 1 ACU)
          memory: 2048M # Limit memory usage to 2 GiB (equivalent to 1 ACU)
        reservations:
          cpus: '0.25'  # Reserve at least 0.25 CPU core on M4 Pro
          memory: 256M # Reserve at least 1 GiB RAM (~0.5 ACU)

  swarm-platform-kernel-redis:
    image: redis:7.4.0
    command: /bin/sh -c "redis-server --requirepass 01j6efde8q4"
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - swarm-platform-kernel-system
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'   # Use up to 0.5 CPU core on M4 Pro (equivalent to 1 ACU)
          memory: 2048M # Limit memory usage to 2 GiB (equivalent to 1 ACU)
        reservations:
          cpus: '0.25'  # Reserve at least 0.25 CPU core on M4 Pro
          memory: 256M # Reserve at least 1 GiB RAM (~0.5 ACU)

  swarm-platform-kernel-seq:
    image: datalust/seq:2025.2
    environment:
      ACCEPT_EULA: "Y"
      SEQ_API_KEY: "01jErQ4kB7D11e78TyX92WqBN8"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"
      - "5340:80"
    networks:
      - swarm-platform-kernel-system
    volumes:
      - swarm-platform-kernel-seq-data:/data
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  swarm-platform-kernel-db-data:
  swarm-platform-kernel-seq-data:

networks:
  swarm-platform-kernel-system:
    driver: overlay
