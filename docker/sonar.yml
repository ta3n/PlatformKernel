services:
  shared-kernel-sonar-db:
    image: postgres:17
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    ports:
      - 5439:5432
    volumes:
      - sonarqube_pg_data:/var/lib/postgresql/data

  shared-kernel-sonar:
    # image: sonarqube:10.7.0-community
    image: sonarqube:community
    depends_on:
      - shared-kernel-sonar-db
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: true
      SONAR_JDBC_URL: jdbc:postgresql://shared-kernel-sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - 127.0.0.1:9001:9000
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://shared-kernel-sonar:9000/api/system/status | grep '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_pg_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
