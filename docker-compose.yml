services:
  platform-kernel-db:
    container_name: platform-kernel-db
    image: postgres:18.2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 01j6efde8q4q48crxe93crwxkc
      READONLY_USER: user_facility_readonly
      READONLY_PASSWORD: 01jj10kbc1pgxw6hchebqaqqv0
    command: [ "postgres", "-c", "config_file=/etc/postgresql/postgresql.conf" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - ./db/dumps:/docker-entrypoint-initdb.d
      - ./db/postgresql/postgresql.conf:/etc/postgresql/postgresql.conf
      - platform-kernel-db-data:/var/lib/postgresql/data
    networks:
      - platform-kernel-system
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'   # Use up to 0.5 CPU core on M4 Pro (equivalent to 1 ACU)
          memory: 2048M # Limit memory usage to 2 GiB (equivalent to 1 ACU)
        reservations:
          cpus: '0.25'  # Reserve at least 0.25 CPU core on M4 Pro
          memory: 1024M # Reserve at least 1 GiB RAM (~0.5 ACU)

  platform-kernel-pgadmin4:
    container_name: platform-kernel-pgadmin4
    image: dpage/pgadmin4:9.7.0
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@localhost.com
      PGADMIN_DEFAULT_PASSWORD: admin.localhost
    networks:
      - platform-kernel-system
    deploy:
      mode: replicated
      replicas: 1

  platform-kernel-redis:
    container_name: platform-kernel-redis
    image: redis:7.4.0
    command: /bin/sh -c "redis-server --requirepass 01j6efde8q4"
    restart: unless-stopped
    networks:
      - platform-kernel-system
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'   # Use up to 0.5 CPU core on M4 Pro (equivalent to 1 ACU)
          memory: 2048M # Limit memory usage to 2 GiB (equivalent to 1 ACU)
        reservations:
          cpus: '0.25'  # Reserve at least 0.25 CPU core on M4 Pro
          memory: 1024M # Reserve at least 1 GiB RAM (~0.5 ACU)

  platform-kernel-redis-commander:
    container_name: platform-kernel-redis-commander
    image: ghcr.io/joeferner/redis-commander:latest
    restart: unless-stopped
    environment:
      HTTP_USER: admin@localhost.com
      HTTP_PASSWORD: admin.localhost
      REDIS_HOSTS: platform-kernel-redis:6379,password=01j6efde8q4
    networks:
      - platform-kernel-system
    deploy:
      mode: replicated
      replicas: 1

  platform-kernel-seq:
    image: datalust/seq:2025.2
    container_name: platform-kernel-seq
    environment:
      ACCEPT_EULA: Y
      SEQ_API_KEY: "01jErQ4kB7D11e78TyX92WqBN8"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    networks:
      - platform-kernel-system
    volumes:
      - platform-kernel-seq-data:/data

  platform-kernel-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    ports:
      - "9010:9000"                       # MinIO Console
      - "9011:9001"                       # MinIO Management Console
    environment:
      MINIO_ROOT_USER: minioadmin         # Root username
      MINIO_ROOT_PASSWORD: minioadmin123  # Root password
    volumes:
      - platform-kernel-minio-data:/data                  # Persistent data storage
    command: server /data --console-address ":9011"

volumes:
  platform-kernel-db-data:
  platform-kernel-seq-data:
  platform-kernel-minio-data:

networks:
  platform-kernel-system:
    name: platform-kernel-system-network
