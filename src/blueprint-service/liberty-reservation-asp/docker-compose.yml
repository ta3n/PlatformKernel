      App_Name: "Liberty.Reservation.Employee.WebApi"
      App_Version: "0.0.1"
      ConnectionStrings__DataContextConnection: "Server=liberty-reservation-db;Port=5432;Database=liberty_reservation;User id=postgres;Pwd=;"
      SerilogLogging__WriteToSeq__Enabled: "true"
      SerilogLogging__WriteToSeq__Url: "http://liberty-reservation-seq:80"
      SerilogLogging__WriteToSeq__ApiKey: "01jErQ4kB7D11e78TyX92WqBN8"
      Redis__Enabled: "true"
      Redis__UrlConfiguration: "liberty-reservation-redis:6379,password=01j6efde8q4"
      Redis__InstanceName: "L:Res:Emp:"
      Redis__SlidingExpirationInSecond: "3600"
