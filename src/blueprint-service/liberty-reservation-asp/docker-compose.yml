services:
  liberty-reservation-db:
    container_name: liberty-reservation-db
    image: postgres:16.4
    environment:
      POSTGRES_DB: liberty_reservation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 01j6efde8q4q48crxe93crwxkc
      READONLY_USER: user_facility_readonly
      READONLY_PASSWORD: 01jj10kbc1pgxw6hchebqaqqv0
    command: [ "postgres", "-c", "config_file=/etc/postgresql/postgresql.conf" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - ./db/dumps:/docker-entrypoint-initdb.d
      - ./db/postgresql/postgresql.conf:/etc/postgresql/postgresql.conf
      - liberty-db-data:/var/lib/postgresql/data
    networks:
      - liberty-system
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'   # Use up to 0.5 CPU core on M4 Pro (equivalent to 1 ACU)
          memory: 2048M # Limit memory usage to 2 GiB (equivalent to 1 ACU)
        reservations:
          cpus: '0.25'  # Reserve at least 0.25 CPU core on M4 Pro
          memory: 1024M # Reserve at least 1 GiB RAM (~0.5 ACU)

  liberty-reservation-pgadmin4:
    container_name: liberty-reservation-pgadmin4
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@liberty.com
      PGADMIN_DEFAULT_PASSWORD: admin.liberty
    networks:
      - liberty-system
    deploy:
      mode: replicated
      replicas: 1

  liberty-reservation-redis:
    container_name: liberty-reservation-redis
    image: redis:7.4.0
    command: /bin/sh -c "redis-server --requirepass 01j6efde8q4"
    restart: unless-stopped
    networks:
      - liberty-system
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'   # Use up to 0.5 CPU core on M4 Pro (equivalent to 1 ACU)
          memory: 2048M # Limit memory usage to 2 GiB (equivalent to 1 ACU)
        reservations:
          cpus: '0.25'  # Reserve at least 0.25 CPU core on M4 Pro
          memory: 1024M # Reserve at least 1 GiB RAM (~0.5 ACU)

  liberty-reservation-redis-commander:
    container_name: liberty-reservation-redis-commander
    image: ghcr.io/joeferner/redis-commander:latest
    restart: unless-stopped
    environment:
      HTTP_USER: admin@liberty.com
      HTTP_PASSWORD: admin.liberty
      REDIS_HOSTS: liberty-reservation-redis:6379,password=01j6efde8q4
    networks:
      - liberty-system
    deploy:
      mode: replicated
      replicas: 1

  liberty-reservation-seq:
    image: datalust/seq
    container_name: liberty-reservation-seq
    environment:
      ACCEPT_EULA: Y
      SEQ_API_KEY: "01jErQ4kB7D11e78TyX92WqBN8"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    networks:
      - liberty-system
    volumes:
      - liberty-seq-data:/data

  liberty-reservation-minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9010:9000"                       # MinIO Console
      - "9011:9001"                       # MinIO Management Console
    environment:
      MINIO_ROOT_USER: minioadmin         # Root username
      MINIO_ROOT_PASSWORD: minioadmin123  # Root password
    volumes:
      - liberty-minio-data:/data                  # Persistent data storage
    command: server /data --console-address ":9011"

  liberty-reservation-db-migration:
    platform: linux/amd64
    container_name: liberty-reservation-db-migration
    image: ${REGISTRY:-liberty}/reservation/db-migration:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: src/modules/Liberty.Reservation.DbMigration/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApplicationName: "liberty-reservation-db-migration"
      App_Name: "Liberty.Reservation.DbMigration"
      App_Version: "0.0.1"
      ConnectionStrings__MigrationsAssembly: "Liberty.Reservation.DbMigration"
      ConnectionStrings__DataContextConnection: "Server=liberty-reservation-db;Port=5432;Database=liberty_reservation;User id=postgres;Pwd=;"
    stdin_open: true
    tty: true
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 512M
    networks:
      - liberty-system
    depends_on:
      liberty-reservation-db:
        condition: service_healthy

  liberty-reservation-employee-webapi:
    platform: linux/amd64
    container_name: liberty-reservation-employee-webapi
    image: ${REGISTRY:-liberty}/reservation/employee-webapi:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: src/services/employee/Liberty.Reservation.Employee.WebAPI/Dockerfile
