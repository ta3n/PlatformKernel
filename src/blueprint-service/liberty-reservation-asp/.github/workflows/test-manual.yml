name: .NET 🧪 Run Unit Tests Manually

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run all tests'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: self-hosted
    env:
      DOTNET_INSTALL_DIR: $HOME/.dotnet

    steps:
      - name: 📥 Checkout source with submodules
        uses: actions/checkout@v4

      - name: 🔁 Setup git submodules
        run: |
          git remote set-url origin git@github.com:${GITHUB_REPOSITORY}.git
          git submodule sync
          git submodule update --init --recursive

      - name: 🧰 Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 📦 Verify .NET installation
        run: dotnet --info

      - name: 🐳 Debug Docker status
        run: |
          whoami
          groups
          docker info
          ls -l /var/run/docker.sock

      - name: 🧪 Run all tests (*.Test.csproj)
        run: |
          for proj in $(find . -type f -name "*.Test.csproj"); do
            echo "▶️ Running tests for $proj"
            dotnet test "$proj" --verbosity minimal
          done
