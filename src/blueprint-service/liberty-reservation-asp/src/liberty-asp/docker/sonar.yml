services:
  liberty-sonar:
    image: sonarqube:10.7.0-community
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    ports:
      - 127.0.0.1:9001:9000
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://liberty-sonar:9000/api/system/status | grep '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
