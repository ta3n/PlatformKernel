syntax = "proto3";

package liberty.site.v1;

option csharp_namespace = "Liberty.Protobuf.Site.V1";

import "site_model.proto";

message GetFacilitySiteProtoRequest {
  string facility_code = 1;
  string site_code = 2;
}

message SearchBookingByPlanProtoRequest {
  PageableProtoModel pageable = 1;
  BookingSearchProtoModel booking_search = 2;
}
