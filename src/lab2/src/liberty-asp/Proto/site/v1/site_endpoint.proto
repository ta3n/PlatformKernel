syntax = "proto3";

package liberty.site.v1;

option csharp_namespace = "Liberty.Protobuf.Site.V1";

import "google/protobuf/empty.proto";
import "site_request.proto";
import "site_response.proto";

service SiteProtoEndpoint {
  rpc Ping (google.protobuf.Empty) returns (PongProtoReply);

  rpc GetFacilitySite (GetFacilitySiteProtoRequest) returns (GetFacilitySiteProtoReply);

  rpc SearchBookingByPlan (SearchBookingByPlanProtoRequest) returns (SearchBookingByPlanProtoReply);
}
