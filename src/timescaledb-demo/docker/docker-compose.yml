services:
  timescaledb:
    image: timescale/timescaledb-ha:pg17
    container_name: platformkernel-timescaledb-demo
    environment:
      POSTGRES_DB: timescale_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d timescale_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - timescaledb_demo_data:/home/postgres/pgdata/data

volumes:
  timescaledb_demo_data:
