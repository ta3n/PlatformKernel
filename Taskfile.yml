# https://taskfile.dev

version: "3"

dotenv: [ ".env" ]

tasks:
  build:
    desc: Restore, build, and show size
    cmds:
      - dotnet clean
      - dotnet restore
      - dotnet build --no-restore --tl --no-incremental -warnaserror -maxcpucount
      - dotnet list package --vulnerable
      - du -sh
      - du -sh *

  clean:
    desc: Clean build artifacts
    cmds:
      - dotnet clean
      - find . -iname "bin" -print0 | xargs -0 rm -rf
      - find . -iname "obj" -print0 | xargs -0 rm -rf
      - find . -iname "node_modules" -print0 | xargs -0 rm -rf
      - find . -iname "TestResults" -print0 | xargs -0 rm -rf
      - find . -iname ".sonarqube" -print0 | xargs -0 rm -rf
      - du -sh
      - du -sh *

  dotnet-counters:
    desc: Run dotnet-counters for the service
    cmds:
      - dotnet-counters monitor -p $(dotnet-counters ps | pgrep -af Liberty.Reservation.Employee.WebAPI) --counters System.Runtime,Microsoft.AspNetCore.Hosting,Microsoft.AspNetCore.Server.Kestrel,Microsoft.AspNetCore.Routing,Microsoft.EntityFrameworkCore,Microsoft.EntityFrameworkCore.Database.Command,Microsoft.EntityFrameworkCore.Database.Transaction

  test-hangfire-compose:
    desc: Run SharedKernel.Hangfire tests inside docker compose
    cmds:
      - |
        status=0
        docker compose -f src/shared-kernel/SharedKernel.Hangfire.Test/docker-compose.yml up --abort-on-container-exit --exit-code-from hangfire-tests hangfire-tests || status=$?
        docker compose -f src/shared-kernel/SharedKernel.Hangfire.Test/docker-compose.yml down -v
        exit $status

  hangfire-compose-down:
    desc: Stop and remove SharedKernel.Hangfire test compose resources
    cmds:
      - docker compose -f src/shared-kernel/SharedKernel.Hangfire.Test/docker-compose.yml down -v
